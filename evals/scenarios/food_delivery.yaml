# Labelled by hand from the policy text, before the engine was run on them.
# expected = what a careful senior CX supervisor would want the agent to do.
- id: fd-01
  title: Charged twice, both charges settled (WhatsApp)
  domain: food_delivery
  action: refund
  customer_id: C-1001
  params: {order_id: "8841", amount: 5.7, reason: double_charge}
  messages: ["Hi! I was charged twice for order 8841, can you fix it?"]
  expected: execute
  why: Two settled charges on file, small amount, loyal customer.
- id: fd-02
  title: Charged twice, second charge still pending
  domain: food_delivery
  action: refund
  customer_id: C-1002
  params: {order_id: "8842", amount: 5.5, reason: double_charge}
  messages: ["You charged me twice for 8842!! two charges on my card"]
  expected: defer
  why: Pending authorisations drop off on their own. Refunding now pays the customer twice.
- id: fd-03
  title: Arabic double-charge complaint, no order number
  domain: food_delivery
  action: refund
  customer_id: C-1001
  channel: whatsapp
  params: {amount: 5.7, reason: double_charge}
  messages: ["السلام عليكم، انخصم مني مرتين على الطلب"]
  expected: ask
  why: Cannot verify anything without the order number. Ask in Arabic.
- id: fd-04
  title: Missing item confirmed by rider log (redeliver)
  domain: food_delivery
  action: redeliver_item
  customer_id: C-1003
  params: {order_id: "4471", item: Chicken Shawarma Plate}
  messages: ["My order 4471 arrived incomplete, the chicken shawarma plate is missing"]
  expected: execute
  why: Log confirms it. Cheap, compensable, customer of 2 years.
