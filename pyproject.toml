[project]
name = "decision-engine"
version = "0.1.0"
description = "A decision layer that decides whether an AI customer-service agent is allowed to act: execute, ask, defer, escalate or refuse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gradio>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
